# BTCUSDT 90-day research config (xrock dataset / model-eval / backtest). Derived from conf/xrock.conf.
# xrock config. Keys are addressed as section.key; ${VAR} expands from the environment.

[general]
log_level = info                  # debug | info | warn | error

[exchange]
name        = bybit               # venue adapter: bybit | synthetic
env         = testnet             # mainnet | testnet | demo
api_key     = ${BYBIT_API_KEY}
api_secret  = ${BYBIT_API_SECRET}
recv_window = 5000                # ms
book_depth  = 50                  # orderbook.{1,50,200,1000}
archive_url = https://public.bybit.com   # daily trade archives used by `xrock fetch`

[market]
symbols = BTCUSDT
streams = trade, funding           # 90-day history has no books (Bybit offers none)
book_interval = 100ms             # live: store at most one top-of-book snapshot per interval (0 = every update)

# Contract specs for rounding and the backtester. Bybit: GET /v5/market/instruments-info
[instrument.BTCUSDT]
category           = linear
tick_size          = 0.1
lot_size           = 0.001
min_qty            = 0.001
maker_fee          = 0.0002
taker_fee          = 0.00055
maintenance_margin = 0.005

[instrument.ETHUSDT]
category           = linear
tick_size          = 0.01
lot_size           = 0.01
min_qty            = 0.01
maker_fee          = 0.0002
taker_fee          = 0.00055
maintenance_margin = 0.005

[margin]
mode     = isolated               # the backtester models isolated only
leverage = 5

# ---- L1 data ----
[data]
backend = kds                     # storage backend: kds | file | sqlite
root    = data                    # default location for every backend

# Historical download (xrock fetch). Days already in the store are skipped, so reruns resume.
# Bybit: trade (daily archive, published the next day) and funding (REST); books only live.
[fetch]
start   = 2026-09-01
end     = 2026-10-01                # exclusive
streams = trade, funding

[data.kds]                        # project-hosted kds_server: scripts/kds.sh, conf/kds.conf, .claude/docs/ckdbs/README.md
host         = 127.0.0.1
port         = 25432              # = port in conf/kds.conf
protocol     = kwp                # kwp | text (newline protocol of pre-2026-08-31 servers)
table_prefix = md                 # -> md_<exchange>_<stream>_<symbol>
batch_rows   = 1024               # rows per INSERT, <= server max_insert_rows

[data.file]
root = data                       # -> data/<exchange>/<symbol>/<stream>/<YYYY-MM-DD>.bin

[data.sqlite]
path = data/bybit.sqlite

# ---- shared by backtest and live ----
[risk]
max_order_notional    = 5000      # quote currency; 0 = off
max_position_notional = 20000
max_leverage          = 5         # gross notional / equity
max_daily_loss        = 500
max_orders_per_sec    = 5

[strategy]
name = ma_cross

[strategy.ma_cross]
symbol   = BTCUSDT
interval = 1m                     # 1s .. 1d
fast     = 10
slow     = 30
qty      = 0.01

[strategy.trade_flow]
symbol    = BTCUSDT
window    = 10s
threshold = 5
hold      = 30s
qty       = 0.01

[strategy.buy_hold]
symbol = BTCUSDT
qty    = 0.01

# ---- L2 backtest ----
[backtest]
start          = 2026-10-01
end            = 2026-10-05       # exclusive
initial_equity = 10000
latency        = 50ms             # one-way order latency
slippage_bps   = 1                # extra cost on market orders

# ---- L3 research ----
[research]
strategy   = ma_cross
sweep.fast = 5, 10, 20            # grid over [strategy.<name>] params
sweep.slow = 30, 60
baselines  = buy_hold

# ---- L3 ML: dataset export / model evaluation (xrock dataset, xrock model-eval <model.json>) ----
# Feature names: ret_<d> vol_<d> flow_<d> logvol_<d> rate_<d> spread imb_<n> funding (src/ml/features.hpp).
# spread / imb_<n> need the book stream; samples whose features are not computable are skipped.
[dataset]                         # BTCUSDT, 90 days of Bybit history (trades + funding), 1s grid
symbol   = BTCUSDT
features = ret_1s, ret_10s, ret_60s, ret_5m, vol_60s, flow_10s, flow_60s, flow_5m, logvol_60s, rate_60s, funding, rv_1m_15, rv_1m_60, ewmavol_1m_30, garch_1m
sample   = 1s
max_gap  = 10s
horizons = 10s, 60s, 5m
barriers = 1:1:1m, 1:1:5m, 2:1:5m, 1:2:5m, 2:2:15m, 3:1.5:15m
barrier_vol = ewmavol_1m_30
start    = 2026-07-09
end      = 2026-10-07             # exclusive
out      = datasets/btcusdt_90d_1s

[splits]                          # walk-forward on the first 76 days, last 14 days held out
train         = 30d
test          = 7d
step          = 7d
embargo       = 15m               # >= longest horizon (15m barriers)
expanding     = false
holdout_start = 2026-09-23

[strategy.model]                  # xrock-model/1 file; trade = false is shadow mode (predictions.csv only)
model  = models/btcusdt_linear.json
trade  = false
enter  = 0.0005
exit   = 0.0001
qty    = 0.01

[strategy.barrier]                # model decides buy/sell threshold, take-profit, loss-cut, duration (see below)
model    = models/btcusdt_barrier.json   # outputs tb_<i>_long/short (grid) or side, k_tp, k_sl, hold (direct)
trade    = false                  # false = shadow
qty      = 0.01
min_edge = 0.0012                 # expected log return must beat round-trip cost + margin

# ---- L4 live ----
[live]
initial_equity = 10000            # TODO: read from the venue wallet
allow_mainnet  = false
tick           = 10ms             # timer resolution of the live loop

# ---- L5 analytics ----
[analytics]
out_dir         = results
equity_interval = 1m
