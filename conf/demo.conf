# Offline demo: synthetic venue -> collect -> backtest / research / report.

[exchange]
name = synthetic

[synthetic]
start          = 2026-01-01
end            = 2026-01-04
price          = 60000
volatility     = 0.6              # annualized
trades_per_sec = 1
book_every     = 5
seed           = 42

[market]
symbols = BTCUSDT
streams = trade, book, funding

[instrument.BTCUSDT]
tick_size = 0.1
lot_size  = 0.001
min_qty   = 0.001

[margin]
leverage = 5

[data]
backend = sqlite                  # file | sqlite
root    = data

[risk]
max_order_notional = 5000
max_leverage       = 5
max_orders_per_sec = 5

[strategy]
name = ma_cross

[strategy.ma_cross]
symbol   = BTCUSDT
interval = 5m
fast     = 5
slow     = 20
qty      = 0.02

[strategy.trade_flow]
symbol    = BTCUSDT
window    = 10s
threshold = 0.1
hold      = 30s
qty       = 0.01

[strategy.buy_hold]
symbol = BTCUSDT
qty    = 0.02

[backtest]
start          = 2026-01-01
end            = 2026-01-04
initial_equity = 10000
latency        = 50ms
slippage_bps   = 1

[research]
strategy   = ma_cross
sweep.fast = 3, 5, 10
sweep.slow = 20, 40
baselines  = buy_hold

[analytics]
out_dir         = results
equity_interval = 1m
