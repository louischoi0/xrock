# kds_server settings for the project-hosted instance (scripts/kds.sh). Unknown keys refuse startup.
# Paths are relative to the project root (kds.sh runs the server from there). Key reference:
# .claude/docs/ckdbs/upstream/manual/server/server.md
data_file              = var/kds/xrock.db
port                   = 25432          # 15432 is taken by another project's instance on this host
log_dir                = var/kds
log_file               = kdb.log
log_level              = info
durability             = group          # strict | group | relaxed
checkpoint_interval_ms = 5000           # dirty-page flush cadence; data is safe after a checkpoint / SYNC / STOP
max_insert_rows        = 1024           # = [data.kds] batch_rows in conf/xrock.conf
